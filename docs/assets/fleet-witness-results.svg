<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="240" viewBox="0 0 1080 240" role="img" aria-labelledby="title"><title id="title">Evidence: 32,830 historical logical responses; 160 new live supervisor requests; 30 valid local effects in the new pilot. These are distinct study measures.</title><rect width="1080" height="240" rx="18" fill="#10172a"/><text x="32" y="88" fill="#b7a6ff" font-family="Arial" font-size="56" font-weight="700">32,830</text><text x="32" y="132" fill="#f2f3fb" font-family="Arial" font-size="14" letter-spacing="1">HISTORICAL RESPONSES</text><text x="32" y="167" fill="#b0bfd4" font-family="Arial" font-size="14">Logical records; attempts unknown</text><text x="386" y="88" fill="#72e8d3" font-family="Arial" font-size="56" font-weight="700">160</text><text x="386" y="132" fill="#f2f3fb" font-family="Arial" font-size="14" letter-spacing="1">NEW PILOT REQUESTS</text><text x="386" y="167" fill="#b0bfd4" font-family="Arial" font-size="14">80 pairs; one live supervisor</text><text x="740" y="88" fill="#ffc183" font-family="Arial" font-size="56" font-weight="700">30</text><text x="740" y="132" fill="#f2f3fb" font-family="Arial" font-size="14" letter-spacing="1">VALID LOCAL EFFECTS</text><text x="740" y="167" fill="#b0bfd4" font-family="Arial" font-size="14">No invalid or revoked effect</text></svg>