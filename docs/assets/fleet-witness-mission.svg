<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="240" viewBox="0 0 1080 240" role="img" aria-labelledby="title"><title id="title">Three different questions: authentic evidence, applicable evidence, current authorization. Only the controller commits the local effect and audit together.</title><rect width="1080" height="240" rx="18" fill="#0b1525"/><rect x="28" y="28" width="320" height="130" rx="12" fill="#152239" stroke="#6fe7d6" stroke-opacity=".5"/><text x="50" y="67" fill="#6fe7d6" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1">01 / AUTHENTIC</text><text x="50" y="107" fill="#e7edf8" font-family="Arial" font-size="18">Who issued it?</text><rect x="380" y="28" width="320" height="130" rx="12" fill="#152239" stroke="#b6a4ff" stroke-opacity=".5"/><text x="402" y="67" fill="#b6a4ff" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1">02 / APPLICABLE</text><text x="402" y="107" fill="#e7edf8" font-family="Arial" font-size="18">Does it support this action?</text><rect x="732" y="28" width="320" height="130" rx="12" fill="#152239" stroke="#ffc17d" stroke-opacity=".5"/><text x="754" y="67" fill="#ffc17d" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1">03 / AUTHORIZED</text><text x="754" y="107" fill="#e7edf8" font-family="Arial" font-size="18">Is permission still current?</text><text x="540" y="204" text-anchor="middle" fill="#b3c5dc" font-family="Arial" font-size="16">One trusted controller · local effect + audit event · one transaction</text></svg>