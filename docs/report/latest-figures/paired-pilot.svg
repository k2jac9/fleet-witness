<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" role="img" aria-labelledby="title desc"><title id="title">The cost of blanket denial</title><desc id="desc">Out of 80 decisions per presentation, raw has 18 invalid approvals and zero invalid denials. Explicit scope has zero invalid approvals and 40 invalid denials. Zero unsafe approval is not useful judgment if every valid case is denied.</desc><rect width="1000" height="292" rx="10" fill="#f5f7fc"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="35" font-size="21" font-weight="700" fill="#162c47">The cost of blanket denial</text><rect x="484" y="21" width="14" height="14" fill="#bb337d"/><text x="506" y="34" font-size="15" fill="#243851">Invalid approval</text><rect x="710" y="21" width="14" height="14" fill="#a85b00"/><text x="732" y="34" font-size="15" fill="#243851">Invalid denial</text><path d="M230 72V231M230 231H920" stroke="#8091a7"/><g stroke="#dbe2ee"><path d="M400 72V231M570 72V231M740 72V231M910 72V231"/></g><text x="26" y="119" font-size="19" fill="#243851">Raw</text><text x="26" y="190" font-size="19" fill="#243851">Explicit scope</text><rect x="230" y="89" width="306" height="25" rx="3" fill="#bb337d"/><text x="545" y="108" font-size="18" fill="#902760">18</text><text x="239" y="140" font-size="17" fill="#844600">0</text><text x="239" y="179" font-size="17" fill="#902760">0</text><rect x="230" y="190" width="680" height="25" rx="3" fill="#a85b00"/><text x="921" y="210" font-size="18" fill="#844600">40</text><g font-size="14" fill="#40556e" text-anchor="middle"><text x="230" y="252">0</text><text x="400" y="252">10</text><text x="570" y="252">20</text><text x="740" y="252">30</text><text x="910" y="252">40</text></g><text x="570" y="278" text-anchor="middle" font-size="15" fill="#40556e">Decision errors (80 decisions per presentation)</text></g></svg>